<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日历清单 · UI 预览</title>
<style>
  :root{
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --line:#E3E8EF;
    --line-soft:#EDF0F4;
    --text:#1F2933;
    --text-2:#56626F;
    --text-3:#6B7684;
    --navy:#1C2B3A;
    --accent:#315F9D;
    --accent-soft:#E7EDF6;
    --green:#2E7D6B;
    --wine:#8E2E3F;
    --wv-gut:52px;   /* 周视图时间刻度列宽 */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* 嵌入模式：缩小外边距，让内容更贴近顶栏 */
  body.is-embed .shell{padding:12px 18px 16px}

  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  svg{display:block}
  [hidden]{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- 顶栏：最深 ---------- */
  .topbar{
    flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 20px;background:var(--navy);color:#E9EEF4;
  }
  .tb-left{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
  .brand{font-size:15px;font-weight:600;letter-spacing:.02em;color:#F3F6FA}
  .brand-sub{font-size:12px;color:#93A2B4;padding-left:2px}
  .tb-right{display:flex;align-items:center;gap:10px}
  .search{
    display:flex;align-items:center;gap:7px;height:32px;width:236px;padding:0 10px;
    border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);
    color:#A9B6C5;transition:background .15s,border-color .15s;
  }
  .search:focus-within{background:rgba(255,255,255,.13);border-color:rgba(146,178,214,.6);color:#DCE6F1}
  .search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#E9EEF4;font-size:13px}
  .search input::placeholder{color:#8C9AAB}
  .seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(255,255,255,.08)}
  .seg-btn{height:26px;padding:0 13px;border-radius:6px;font-size:12.5px;color:#B7C3D1;transition:background .15s,color .15s}
  .seg-btn:hover{color:#E9EEF4}
  .seg-btn.is-on{background:#F2F6FB;color:#1E2C3D;font-weight:600}

  /* ---------- 三段主体 ---------- */
  .shell{flex:1;min-height:0;display:flex;gap:16px;padding:16px 20px 20px}

  /* 左侧清单 */
  .sidebar{width:232px;flex:none;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto;padding-right:2px}
  .new-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border-radius:9px;
    background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;
    box-shadow:0 1px 2px rgba(22,45,74,.2);transition:background .15s;
  }
  .new-btn:hover{background:#2A548C}
  .side-block{display:flex;flex-direction:column;gap:1px}
  .side-title{padding:0 8px 6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--text-3)}
  .nav{
    display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 8px;border-radius:7px;
    font-size:13px;color:#3B4653;text-align:left;transition:background .13s,color .13s;
  }
  .nav:hover{background:#EAEEF4}
  .nav.is-on{background:var(--accent-soft);color:#26496F;font-weight:600}
  .nav svg{color:#7C8795;flex:none}
  .nav.is-on svg{color:#26496F}
  .nav .n{margin-left:auto;font-size:12px;color:#6B7684;font-variant-numeric:tabular-nums}
  .nav.is-on .n{color:#44688F}
  /* 清单图标：对齐滴答清单的圆角色块（不是小圆点） */
  .list-badge{
    width:20px;height:20px;border-radius:5px;flex:none;
    display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;
    letter-spacing:0;line-height:1;
  }
  /* 计数跟随清单色 */
  .nav .n.is-tinted{font-weight:600}
  .stat{margin-top:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  .stat-h{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
  .stat-n{margin-top:2px;font-size:26px;line-height:1.15;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .stat-n small{font-size:13px;font-weight:500;color:#6B7684;margin-left:3px}
  .stat-bar{height:4px;border-radius:2px;background:#E7EBF1;margin-top:9px;overflow:hidden}
  .stat-bar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .2s}
  .stat-sub{margin-top:7px;font-size:11.5px;color:#6B7684}

  /* 中间日历 */
  .cal{
    flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;
  }
  .cal-head{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 0 16px}
  .ch-left{display:flex;align-items:center;gap:3px;min-width:0}
  .cal-title{margin:0 6px;font-size:23px;font-weight:600;letter-spacing:.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
  .icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#5C6775;flex:none;transition:background .13s,color .13s}
  .icon-btn:hover{background:#F0F3F7;color:var(--text)}
  .btn-ghost{height:28px;padding:0 10px;margin-left:7px;border:1px solid #DFE5ED;border-radius:7px;font-size:12.5px;color:#48525F;transition:background .13s,border-color .13s}
  .btn-ghost:hover{background:#F6F8FB;border-color:#CDD6E0}
  .ch-meta{font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}

  .cal-week{flex:none;display:grid;grid-template-columns:34px repeat(7,1fr);height:34px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line)}
  /* 左侧周数（滴答清单同款） */
  /* 周数：顶部对齐（对齐滴答清单），不占满整格视觉重心 */
  .wk-no{
    display:block;padding-top:6px;text-align:center;
    font-size:10px;color:#A9B2BE;font-variant-numeric:tabular-nums;
    background:#FBFCFD;
  }
  .cal-week div{display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.05em;color:#66717F}

  /* 任务详情面板 */
  .detail{
    width:330px;flex:none;display:flex;flex-direction:column;min-height:0;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;
  }
  .detail[hidden]{display:none}
  .d-head{flex:none;display:flex;align-items:center;gap:9px;padding:12px 12px 10px}
  .d-check{width:17px;height:17px;flex:none;accent-color:var(--accent);cursor:pointer}
  .d-title{flex:1;min-width:0;border:0;outline:none;font-size:15px;font-weight:600;color:var(--text);background:none}
  .d-close{width:24px;height:24px;flex:none;border-radius:6px;font-size:17px;line-height:1;color:#8A94A2}
  .d-close:hover{background:#F0F3F7;color:var(--text)}
  .d-meta{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 10px;border-bottom:1px solid var(--line-soft)}
  .d-field{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3)}
  .d-field input{border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-size:12px;background:#fff;color:var(--text)}
  .d-notes{flex:1;min-height:0;resize:none;border:0;outline:none;padding:12px;font-size:13px;line-height:1.65;
           color:var(--text);background:none}
  .d-notes::placeholder{color:#A9B2BE}
  .d-foot{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line-soft)}
  .d-list{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:var(--text)}
  .d-del{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--wine)}
  .d-del:hover{background:#FCF2F4;border-color:#E8C9D0}
  .cal-add{flex:none;padding:0 14px 12px;background:var(--surface)}
  .cal-add-form{display:flex;gap:8px}
  .cal-add-form input{flex:1;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
                      background:#fff;font-size:13px;outline:none}
  .cal-add-form input:focus{border-color:#B9C6D6;box-shadow:0 0 0 3px rgba(49,95,157,.10)}
  .cal-add-form button{height:34px;padding:0 14px;border-radius:8px;background:var(--accent);color:#fff;
                       font-size:13px;font-weight:600}
  .cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:34px repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:1px;background:#E9EDF2}
  .day{position:relative;background:#fff;padding:5px 7px 5px;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden;cursor:pointer;transition:background .12s}
  .day:hover{background:#FAFBFD}
  .day.is-sel{box-shadow:inset 0 0 0 1.5px var(--accent);background:#F8FAFD}
  .day.is-sel:hover{background:#F4F8FD}
  .day.is-out{background:#FBFCFD}
  .day.is-out:hover{background:#F6F8FB}
  .dnum-row{flex:none;display:flex;align-items:center;gap:5px;height:24px}
  .dnum{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:600;color:#3B4653;font-variant-numeric:tabular-nums}
  /* 农历/节气/节日：滴答清单在同一行右侧以浅灰小字呈现 */
  .lunar{font-size:10.5px;color:#8A94A2;line-height:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lunar.is-fest{color:var(--wine)}
  .day.is-today .lunar{color:#2A548C;font-weight:600}
  .day.is-out .dnum{color:#6F7A88;font-weight:500}
  .day.is-today .dnum{background:var(--accent);color:#fff}
  .day.has-overdue .dnum{color:var(--wine)}
  .day.is-today.has-overdue .dnum{color:#fff}
  .chips{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
  .chip{
    display:flex;align-items:center;gap:4px;height:20px;padding:0 5px;border-radius:4px;
    background:#F2F4F8;border-left:2px solid var(--c,#9AA4B2);
    font-size:11.5px;line-height:1;color:#39424E;white-space:nowrap;overflow:hidden;
  }
  .day.is-out .chip{background:#F5F7FA}
  .chip .ct{overflow:hidden;text-overflow:ellipsis}
  .chip.is-done{color:#6B7684;text-decoration:line-through;background:#F6F7F9;border-left-color:#C7CDD6}
  .chip .pd{width:4px;height:4px;border-radius:50%;background:#A63A46;flex:none;margin-left:auto}
  .more{font-size:11px;color:var(--text-3);padding-left:2px}

  /* 周视图 */
  /* ---------------- 周视图：时间轴（对齐 macOS 日历） ---------------- */
  .weekview{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
  /* 日期头：左侧留出时间刻度宽度 */
  .wv-head{flex:none;display:grid;grid-template-columns:var(--wv-gut) repeat(7,minmax(0,1fr));
           border-bottom:1px solid var(--line-soft);background:var(--surface);z-index:3}
  .wv-head .wv-gut{border-right:1px solid var(--line-soft)}
  .wv-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px 5px;cursor:pointer;
          border-left:1px solid var(--line-soft)}
  .wv-day:first-of-type{border-left:0}
  .wv-day .wd{font-size:11.5px;color:var(--text-3);letter-spacing:.04em}
  .wv-day .dn{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;
              font-size:13px;font-weight:600;color:#3B4653;font-variant-numeric:tabular-nums}
  .wv-day .wn{font-size:10px;color:#97A1AE;line-height:1.2}
  .wv-day .wn.is-fest{color:var(--wine)}
  .wv-day.is-today .wd{color:var(--wine)}
  .wv-day.is-today .dn{background:#E8453C;color:#fff}      /* macOS 日历用红色实心圆 */
  .wv-day.is-today .wn{color:#C0392B;font-weight:600}
  .wv-day.is-sel{background:#EAF1FA;box-shadow:inset 0 -2px 0 var(--accent)}
  .wv-day.is-sel .dn{background:var(--accent);color:#fff}
  .wv-day.is-today.is-sel .dn{background:#E8453C;color:#fff}
  .wv-day.is-sel .wd{color:var(--accent);font-weight:600}

  /* 全天区 */
  .wv-allday{flex:none;display:grid;grid-template-columns:var(--wv-gut) repeat(7,minmax(0,1fr));
             border-bottom:1px solid var(--line);min-height:26px;background:#FCFDFE}
  .wv-allday .wv-gut{display:flex;align-items:center;justify-content:flex-end;
                     padding-right:7px;font-size:10px;color:#97A1AE;border-right:1px solid var(--line-soft)}
  .wv-ad{display:flex;flex-direction:column;gap:2px;padding:3px;border-left:1px solid var(--line-soft);min-height:26px}
  .wv-ad:first-of-type{border-left:0}
  .wv-adchip{display:block;width:100%;text-align:left;padding:2px 5px;border-radius:4px;font-size:11px;
             color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}

  /* 时间轴滚动区 */
  .wv-scroll{flex:1;min-height:0;overflow:auto;position:relative}
  /* 画布固定 24 小时高度（由脚本按 WV_HOUR 设定），视口只显示约 13 小时 */
  .wv-canvas{position:relative;display:flex}
  .wv-gutter{flex:none;width:var(--wv-gut);position:relative;height:100%;border-right:1px solid var(--line-soft)}
  .wv-hr{position:absolute;right:7px;font-size:10px;line-height:1;color:#9AA5B3;
         font-variant-numeric:tabular-nums;transform:translateY(-50%)}
  .wv-body{flex:1;position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:100%}
  .wv-col{position:relative;border-left:1px solid var(--line-soft);cursor:crosshair}
  .wv-col:first-child{border-left:0}
  .wv-col.is-today{background:#FFF9F9}
  .wv-col.is-sel{background:#F7FAFE}
  .wv-col.is-today.is-sel{background:#FFF4F4}
  /* 整点横线 */
  .wv-hline{position:absolute;left:0;right:0;border-top:1px solid #EEF1F5;pointer-events:none}
  .wv-hline.half{border-top-style:dashed;border-top-color:#F4F6F9}

  /* 事件块 */
  .wv-event{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 5px;overflow:hidden;
            cursor:grab;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;user-select:none}
  .wv-event .et{font-size:11px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-event .eh{font-size:10px;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
  .wv-event.is-done .et{text-decoration:line-through;opacity:.75}
  .wv-event.is-dragging{opacity:.75;cursor:grabbing;z-index:20;box-shadow:0 6px 16px rgba(16,24,40,.18)}

  /* 拖选高亮 */
  .wv-sel{position:absolute;left:2px;right:2px;border-radius:5px;background:rgba(49,95,157,.16);
          border:1px solid rgba(49,95,157,.5);pointer-events:none;z-index:15}
  /* 拖选后原地出现的输入框 */
  .wv-quick{position:absolute;z-index:30;left:2px;right:2px;background:#fff;border:1px solid var(--accent);
            border-radius:6px;padding:4px;box-shadow:0 8px 20px rgba(16,24,40,.16)}
  .wv-quick input{width:100%;border:0;outline:none;font-size:12px;padding:3px 4px;background:none}
  .wv-quick .qh{font-size:10px;color:var(--text-3);padding:0 4px 2px;font-variant-numeric:tabular-nums}

  /* 当前时间线 */
  .wv-now{position:absolute;left:0;right:0;height:0;border-top:2px solid #E8453C;pointer-events:none;z-index:12}
  .wv-now::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#E8453C}
  .wv-now span{position:absolute;left:2px;top:-9px;background:#E8453C;color:#fff;font-size:9px;padding:0 3px;
               border-radius:3px;font-variant-numeric:tabular-nums}

  /* ---------------- 左下角迷你月历 ---------------- */
  /* 清单区标题行 + 新增按钮 */
  .side-title-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .side-add{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;
            font-size:13px;line-height:1;color:#8A94A2}
  .side-add:hover{background:#EAEEF4;color:var(--text)}
  /* 就地改名输入框 */
  .lrename{flex:1;min-width:0;border:1px solid var(--accent);border-radius:5px;
           padding:1px 5px;font-size:13px;outline:none;background:#fff;color:var(--text)}

  .mini{margin-top:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 9px 7px}
  .mini-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
  .mini-t{font-size:11.5px;font-weight:600;color:#3B4653;font-variant-numeric:tabular-nums}
  .mini-nav{display:flex;gap:1px}
  .mini-nav button{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:#8A94A2}
  .mini-nav button:hover{background:#F0F3F7;color:var(--text)}
  .mini-w{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
  .mini-w i{font-style:normal;font-size:9px;color:#A9B2BE;text-align:center}
  .mini-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:1px}
  .mini-d{height:17px;display:grid;place-items:center;border-radius:50%;font-size:10px;color:#48525F;
          font-variant-numeric:tabular-nums;cursor:pointer}
  .mini-d:hover{background:#EEF2F7}
  .mini-d.is-out{color:#C3CAD3}
  .mini-d.is-today{background:#E8453C;color:#fff;font-weight:600}
  .mini-d.is-sel{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
  .mini-d.has{position:relative}
  .mini-d.has::after{content:'';position:absolute;bottom:1px;width:3px;height:3px;border-radius:50%;background:#A9B2BE}

  /* 右侧当日任务 */
  .panel{
    display:none;   /* 右侧改为 AI 对话（宿主渲染），当天清单不再显示 */
    width:344px;flex:none;flex-direction:column;min-height:0;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .p-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 16px 0}
  .p-date{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .p-date h2{margin:0;font-size:21px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .p-wd{font-size:12.5px;color:#5F6B79;background:#F1F4F8;border-radius:5px;padding:2px 6px}
  .p-filter{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 4px 0 7px;border-radius:5px;background:var(--accent-soft);color:#26496F;font-size:11.5px;font-weight:600}
  .p-filter .x{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:#4C6E97}
  .p-filter .x:hover{background:rgba(38,73,111,.12)}
  .p-prog{padding:10px 16px 12px}
  .prog-line{display:flex;justify-content:space-between;font-size:12px;color:#5F6B79;margin-bottom:6px;font-variant-numeric:tabular-nums}
  .bar{height:4px;border-radius:2px;background:#E9EDF2;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .2s}
  .p-scroll{flex:1;min-height:0;overflow:auto;padding:0 10px 8px}
  .sec-h{display:flex;align-items:center;gap:6px;padding:9px 6px 5px;font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--text-3)}
  .sec-h .n{font-weight:500;color:#6B7684}
  .task{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background .12s}
  .task:hover{background:#F6F8FB}
  .task input{position:absolute;opacity:0;width:18px;height:18px;margin:0;pointer-events:none}
  .cb{
    flex:none;margin-top:1px;width:18px;height:18px;border-radius:50%;border:1.5px solid #8A95A4;
    display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s;
  }
  .cb svg{width:11px;height:11px}
  .task input:checked + .cb{background:var(--accent);border-color:var(--accent);color:#fff}
  .task input:focus-visible + .cb{outline:2px solid var(--accent);outline-offset:2px}
  .t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .t-title{font-size:14px;line-height:1.35;color:#222B36;word-break:break-word}
  .task.is-done .t-title{color:#6B7684;text-decoration:line-through}
  .t-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3)}
  .t-dot{width:6px;height:6px;border-radius:50%;flex:none}
  .prio-flag{color:var(--wine);font-weight:600}
  .p-empty{padding:30px 12px;text-align:center;font-size:12.5px;line-height:1.7;color:#6E7A89}
  .p-empty strong{display:block;margin-bottom:3px;font-size:13.5px;font-weight:600;color:#4A5563}
  .p-add{flex:none;display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line-soft)}
  .p-add input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid #DFE5ED;border-radius:8px;background:#FBFCFE;color:var(--text);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
  .p-add input::placeholder{color:#6E7A89}
  .p-add input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(49,95,157,.12)}
  .p-add button{flex:none;height:34px;padding:0 12px;border-radius:8px;background:var(--accent-soft);color:#26496F;font-size:12.5px;font-weight:600;transition:background .15s}
  .p-add button:hover{background:#DCE7F4}


  /* ---------- 清单视图（列表 / 看板） ---------- */
  .lv-btn.is-on{background:var(--accent-soft);color:#26496F;border-color:#C7D6E8}
  .lv-head{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px 0 18px}
  .lv-title{margin:0;font-size:23px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .lv-meta{font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .lv-spacer{flex:1}
  .lv-btn{height:28px;padding:0 10px;border:1px solid #DFE5ED;border-radius:7px;font-size:12.5px;color:#48525F;background:none;transition:background .13s,border-color .13s}
  .lv-btn:hover{background:#F6F8FB;border-color:#CDD6E0}

  .lv{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .lv-body{flex:1;min-height:0;overflow:auto;padding:0 16px 24px}
  .lv-inner{max-width:920px;margin:0 auto}
  .lv-quick{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px;border-bottom:1px solid var(--line-soft);color:var(--text-3)}
  .lv-quick:focus-within{color:var(--accent);border-bottom-color:var(--accent)}
  .lv-quick input{flex:1;min-width:0;height:44px;border:0;background:none;outline:none;font-size:13.5px;color:var(--text)}
  .lv-quick input::placeholder{color:#8B97A5}
  .lv-group{padding-top:2px}
  .lv-ghead{display:flex;align-items:center;gap:8px;padding:15px 10px 5px;font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--text-3)}
  .lv-ghead .n{font-weight:500;color:#8B97A5;font-variant-numeric:tabular-nums}
  .lv-row{cursor:pointer}
  .lv-row.is-sel{background:#EAF1FA;box-shadow:inset 2px 0 0 var(--accent)}
  .lv-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;transition:background .12s}
  .lv-row:hover{background:#F6F8FB}
  .lv-row-title{flex:1;min-width:0;font-size:14px;line-height:1.45;color:#222B36;word-break:break-word}
  .lv-row.is-done .lv-row-title{color:#6B7684;text-decoration:line-through}
  .lv-row-meta{flex:none;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .lv-dot{width:6px;height:6px;border-radius:50%;flex:none}
  .lv-overdue{color:var(--wine);font-weight:600}
  .lv-prio{color:var(--wine);font-weight:600}
  .lv-empty{padding:44px 10px;font-size:12.5px;color:#8B97A5;text-align:center}

  .bv{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:0 16px 16px}
  .bv-inner{display:flex;align-items:flex-start;gap:14px;min-height:100%}
  .bv-col{flex:1 1 0;min-width:240px;max-width:380px;max-height:100%;display:flex;flex-direction:column;min-height:0;background:#F6F8FB;border:1px solid #E9EDF3;border-radius:10px}
  .bv-col.is-over{background:#EDF3FA;border-color:#B9CDE5}
  .bv-head{flex:none;display:flex;align-items:center;gap:7px;padding:8px 8px 8px 10px;min-height:38px}
  .bv-name{font-size:13px;font-weight:600;color:#2B3542;padding:2px;border-radius:4px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bv-name:hover{background:#EBEFF5}
  .bv-count{font-size:11.5px;color:#7B8797;font-variant-numeric:tabular-nums}
  .bv-head .sp{flex:1}
  .bv-icon{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#6E7A89;flex:none}
  .bv-icon:hover{background:#EBEFF5;color:#1F2933}
  .bv-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:0 8px 8px}
  .bv-card{flex:none;display:flex;align-items:flex-start;gap:8px;padding:9px 10px;margin-bottom:7px;background:#fff;border:1px solid #E4E9F0;border-radius:8px;cursor:grab;transition:border-color .12s,box-shadow .12s,opacity .12s}
  .bv-card:hover{border-color:#CBD5E1;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .bv-card.is-dragging{opacity:.45}
  .bv-card.is-sel{box-shadow:0 0 0 2px var(--accent)}
  .bv-card-body{flex:1;min-width:0}
  .bv-card-title{font-size:13px;line-height:1.4;color:#222B36;word-break:break-word}
  .bv-card.is-done .bv-card-title{color:#6B7684;text-decoration:line-through}
  .bv-card-meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:11px;color:var(--text-3);flex-wrap:wrap}
  .bv-add{display:flex;align-items:center;gap:6px;width:100%;padding:7px 6px;border-radius:7px;font-size:12.5px;color:#6E7A89;text-align:left}
  .bv-add:hover{background:#E9EEF5;color:#26496F}
  .bv-add-input{width:100%;min-height:34px;padding:8px 10px;border:1px solid var(--accent);border-radius:8px;background:#fff;font-size:13px;outline:none;box-shadow:0 0 0 3px rgba(49,95,157,.10)}
  .bv-name-input{width:150px;height:26px;padding:0 6px;border:1px solid var(--accent);border-radius:5px;background:#fff;font-size:13px;font-weight:600;outline:none}
  .cb-wrap{flex:none;margin-top:1px;position:relative;display:flex}
  .cb-wrap input{position:absolute;opacity:0;width:18px;height:18px;margin:0;pointer-events:none}
  .cb-wrap input:checked + .cb{background:var(--accent);border-color:var(--accent);color:#fff}
  .cb-wrap input:focus-visible + .cb{outline:2px solid var(--accent);outline-offset:2px}


  /* ---------- 对齐滴答清单：列表行与详情 ---------- */
  .lv-ghead{cursor:pointer;border-radius:6px}
  .lv-ghead:hover{color:var(--text)}
  .lv-ghead .chev{width:18px;height:18px;display:grid;place-items:center;color:#8B97A5;transition:transform .15s;flex:none}
  .lv-ghead.is-collapsed .chev{transform:rotate(-90deg)}
  .lv-row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .lv-row-body .lv-row-title{flex:none}
  .lv-note{font-size:11.5px;color:#8B97A5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flag{display:inline-flex;width:12px;height:12px;flex:none}
  .flag svg{width:12px;height:12px}
  .flag-high{color:#D9534F}
  .flag-normal{color:#E0A800}
  .flag-low{color:#4A90D9}
  .lv-date{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .lv-date.is-today{color:var(--accent);font-weight:600}
  .lv-date.is-over{color:var(--wine);font-weight:600}

  .detail{width:330px}
  .d-title{resize:none;overflow:hidden;font-size:18px;font-weight:600;line-height:1.4;padding:4px 2px;min-height:32px}
  .d-date-btn{display:flex;align-items:center;gap:8px;margin:2px 12px 0;height:34px;padding:0 10px;
              border:1px solid var(--line);border-radius:8px;background:#FBFCFE;font-size:12.5px;color:var(--text-2);
              transition:border-color .13s,background .13s}
  .d-date-btn:hover{border-color:#C6D0DC;background:#fff}
  .d-date-btn.is-set{color:var(--text)}
  .d-date-btn.is-over #dDateText{color:var(--wine);font-weight:600}
  .d-check{appearance:none;-webkit-appearance:none;width:18px;height:18px;flex:none;margin:0;border-radius:50%;
           border:1.5px solid #8A95A4;background:#fff;position:relative;cursor:pointer;transition:background .12s,border-color .12s}
  .d-check:hover{border-color:var(--accent)}
  .d-check:checked{background:var(--accent);border-color:var(--accent)}
  .d-check:checked::after{content:'';position:absolute;left:5px;top:2px;width:5px;height:9px;
                          border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .d-check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .d-foot{margin-top:auto}
  .d-date-btn .d-dt{color:var(--accent);font-weight:600}
  .d-fields{display:flex;flex-direction:column;gap:10px;padding:12px}
  .d-field{display:flex;flex-direction:column;gap:5px}
  .d-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-2)}
  .d-row>span{width:42px;flex:none;color:var(--text-3)}
  .d-select{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;background:#FBFCFE;color:var(--text);font-size:12.5px;padding:0 8px}
  .d-prio{display:flex;gap:4px;flex:1}
  .d-prio button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:30px;border:1px solid var(--line);border-radius:7px;background:#FBFCFE;font-size:12px;color:var(--text-2)}
  .d-prio button:hover{border-color:#C6D0DC}
  .d-prio button.on{border-color:var(--accent);background:#EEF3FA;color:#26496F;font-weight:600}
  .d-notes{width:calc(100% - 0px);min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#FBFCFE;
           padding:8px 10px;font-size:12.5px;line-height:1.6;color:var(--text);outline:none}
  .d-notes:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,95,157,.10);background:#fff}
  .d-note-row{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-3)}
  .d-head{gap:8px}

  /* 日期弹层（对齐滴答清单的日期选择） */
  .dp{position:fixed;z-index:70;width:300px;padding:10px;background:#fff;border:1px solid #DDE3EB;
      border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.16)}
  .dp[hidden]{display:none}
  .dp-tabs{display:flex;gap:2px;padding:2px;border-radius:8px;background:#F1F4F8;margin-bottom:8px}
  .dp-tabs button{flex:1;height:26px;border-radius:6px;font-size:12px;color:#6B7684}
  .dp-tabs button.on{background:#fff;color:#1F2933;font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
  .dp-quick{display:flex;gap:6px;margin-bottom:6px}
  .dp-quick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:8px;
                   font-size:11px;color:#6B7684}
  .dp-quick button:hover{background:#F4F7FB;color:#26496F}
  .dp-month{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:600}
  .dp-nav{display:flex;gap:2px}
  .dp-nav button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:#6B7684}
  .dp-nav button:hover{background:#F1F4F8}
  .dp-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
  .dp-wd span{text-align:center;font-size:10.5px;color:#8B97A5}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-cell{height:38px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
           font-size:12.5px;color:#3B4653}
  .dp-cell:hover{background:#F2F6FB}
  .dp-cell.is-out{color:#C0C8D2}
  .dp-cell.is-today{color:#D9534F;font-weight:600}
  .dp-cell.is-sel{background:#EAF1FA;box-shadow:inset 0 0 0 1px var(--accent)}
  .dp-lun{font-size:9px;color:#A2ACB8;line-height:1}
  .dp-cell.is-today .dp-lun{color:#E08A86}
  .dp-time{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#5F6B79}
  .dp-time input{flex:1;height:30px;border:1px solid #DDE3EB;border-radius:7px;padding:0 8px;font-size:12.5px;background:#FBFCFE}
  .dp-foot{display:flex;gap:8px;margin-top:10px}
  .dp-foot button{flex:1;height:32px;border-radius:8px;font-size:12.5px}
  .dp-clear{border:1px solid #DDE3EB;color:#6B7684;background:#fff}
  .dp-clear:hover{background:#F6F8FB}
  .dp-ok{background:var(--accent);color:#fff;font-weight:600}

  @media (max-width:1240px){
    .sidebar{width:204px}
    .panel{width:320px}
    .search{width:190px}
  }
  @media (max-width:1080px){
    .shell{gap:12px;padding:12px 14px 16px}
    .sidebar{width:182px}
    .panel{width:292px}
    .cal-title{font-size:20px}
    .ch-meta{display:none}
    .brand-sub{display:none}
  }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="tb-left">
    <span class="logo" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m9 14 2 2 4-4"/></svg>
    </span>
    <span class="brand">日历清单</span>
    <span class="brand-sub">预览版</span>
  </div>
  <div class="tb-right">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="searchInput" type="search" placeholder="搜索任务" aria-label="搜索任务" autocomplete="off">
    </label>
    <div class="seg" role="tablist" aria-label="视图切换">
      <button class="seg-btn is-on" data-view="month" role="tab" aria-selected="true">月</button>
      <button class="seg-btn" data-view="week" role="tab" aria-selected="false">周</button>
      <button class="seg-btn" data-view="list" role="tab" aria-selected="false">列表</button>
      <button class="seg-btn" data-view="board" role="tab" aria-selected="false">看板</button>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="清单导航">
    <button class="new-btn" id="newBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建任务
    </button>

    <div class="side-block">
      <div class="side-title">智能清单</div>
      <button class="nav" data-smart="today">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <span>今天</span><span class="n" data-count="today">0</span>
      </button>
      <button class="nav" data-smart="week">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>最近 7 天</span><span class="n" data-count="week">0</span>
      </button>
      <button class="nav" data-smart="all">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
        <span>全部任务</span><span class="n" data-count="all">0</span>
      </button>
    </div>

    <div class="side-block">
      <div class="side-title side-title-row">
        <span>我的清单</span>
        <button class="side-add" id="addListBtn" type="button" aria-label="新建清单" title="新建清单">+</button>
      </div>
      <div id="listNav"></div>
    </div>

    <section class="mini" aria-label="迷你月历">
      <div class="mini-h">
        <span class="mini-t" id="miniTitle">—</span>
        <span class="mini-nav">
          <button id="miniPrev" type="button" aria-label="上个月">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="miniNext" type="button" aria-label="下个月">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </span>
      </div>
      <div class="mini-w" aria-hidden="true"><i>一</i><i>二</i><i>三</i><i>四</i><i>五</i><i>六</i><i>日</i></div>
      <div class="mini-g" id="miniGrid"></div>
    </section>
  </aside>

  <main class="cal" aria-label="日历">
    <header class="cal-head">
      <div class="ch-left">
        <button class="icon-btn" id="prevBtn" aria-label="上一段">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 class="cal-title" id="calTitle">2026年10月</h1>
        <button class="icon-btn" id="nextBtn" aria-label="下一段">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="btn-ghost" id="todayBtn">今天</button>
      </div>
      <div class="ch-meta" id="calMeta"></div>
    </header>

    <div class="cal-week" id="weekRow" aria-hidden="true">
      <div aria-hidden="true"></div>
      <div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div>
    </div>
    <div class="cal-grid" id="grid" role="grid" aria-label="月历"></div>
    <div class="weekview" id="weekView" hidden></div>

    <div class="lv-head" id="viewHead" hidden>
      <h1 class="lv-title" id="viewTitle">全部任务</h1>
      <span class="lv-meta" id="viewMeta"></span>
      <span class="lv-spacer"></span>
      <button class="lv-btn" id="toggleDetailBtn" type="button" title="显示 / 隐藏详情">详情</button>
      <button class="lv-btn" id="addGroupBtn" hidden>＋ 添加分组</button>
    </div>
    <div class="lv" id="listView" hidden>
      <div class="lv-body">
